name: 构建与发布

# 打 tag（例如 v1.0.0）会自动出安装包并建 Release；也可以在 Actions 页面手动触发。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则取 tag 名去掉前缀 v）'
        required: false
        default: ''
      skip_build:
        description: '跳过编译，直接用仓库里已有的 DLL 打包'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  package:
    name: 打包并发布
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 定位项目目录
        id: locate
        shell: powershell
        run: |
          $hit = Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Recurse -File -Filter 'make-package.ps1' -ErrorAction SilentlyContinue |
                 Where-Object { $_.Directory.Name -eq 'package' } | Select-Object -First 1
          if (-not $hit) { throw '未找到 package\make-package.ps1' }
          $root = Split-Path -Parent $hit.Directory.FullName
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::AppendAllText($env:GITHUB_ENV,    "PROJECT_ROOT=$root`n", $utf8)
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "root=$root`n", $utf8)
          Write-Host "PROJECT_ROOT=$root"

      - name: 解析版本号
        id: ver
        shell: powershell
        run: |
          $v = '${{ github.event.inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($v)) { $v = ('${{ github.ref_name }}' -replace '^v', '') }
          if ([string]::IsNullOrWhiteSpace($v) -or $v -eq 'main' -or $v -eq 'master') { $v = '1.0.0' }
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::AppendAllText($env:GITHUB_ENV,    "PKG_VERSION=$v`n", $utf8)
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$v`n", $utf8)
          Write-Host "PKG_VERSION=$v"

      - name: 准备 .NET Framework 4.8 参考程序集
        shell: powershell
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $refs = Join-Path ${env:ProgramFiles(x86)} 'Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8'
          if (-not (Test-Path (Join-Path $refs 'mscorlib.dll'))) {
            Write-Host '系统没有 v4.8 目标包，改用 NuGet 参考程序集包'
            $nupkg = Join-Path $env:RUNNER_TEMP 'net48refs.nupkg'
            $dir   = Join-Path $env:RUNNER_TEMP 'net48refs'
            Invoke-WebRequest -UseBasicParsing -Uri 'https://api.nuget.org/v3-flatcontainer/microsoft.netframework.referenceassemblies.net48/1.0.3/microsoft.netframework.referenceassemblies.net48.1.0.3.nupkg' -OutFile $nupkg
            if (Test-Path $dir) { Remove-Item -LiteralPath $dir -Recurse -Force }
            [System.IO.Compression.ZipFile]::ExtractToDirectory($nupkg, $dir)
            $refs = Join-Path $dir 'build\.NETFramework\v4.8'
          }
          if (-not (Test-Path (Join-Path $refs 'mscorlib.dll'))) { throw '无法获取 .NET Framework 4.8 参考程序集' }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "CODEX_REFS=$refs`n", (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "CODEX_REFS=$refs"

      - name: 准备 Roslyn 编译器
        shell: powershell
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $csc = $null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path $vswhere) {
            $hit = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\Roslyn\csc.exe' 2>$null
            foreach ($x in @($hit)) { if ($x) { $x = $x.Trim(); if (Test-Path $x) { $csc = $x; break } } }
          }
          if (-not $csc) {
            Write-Host '没有 Visual Studio，改用 NuGet Roslyn 工具包'
            $nupkg = Join-Path $env:RUNNER_TEMP 'roslyn.nupkg'
            $dir   = Join-Path $env:RUNNER_TEMP 'roslyn'
            Invoke-WebRequest -UseBasicParsing -Uri 'https://api.nuget.org/v3-flatcontainer/microsoft.net.compilers.toolset/4.11.0/microsoft.net.compilers.toolset.4.11.0.nupkg' -OutFile $nupkg
            if (Test-Path $dir) { Remove-Item -LiteralPath $dir -Recurse -Force }
            [System.IO.Compression.ZipFile]::ExtractToDirectory($nupkg, $dir)
            $csc = Join-Path $dir 'tasks\net472\csc.exe'
          }
          if (-not (Test-Path $csc)) { throw '无法获取 Roslyn csc.exe' }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "CODEX_CSC=$csc`n", (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "CODEX_CSC=$csc"
      - name: 探测 AutoCAD 托管程序集
        shell: powershell
        run: |
          # 编译插件需要 AutoCAD 2024 的 acdbmgd/accoremgd/acmgd/AdWindows。
          # 这些 DLL 有版权，不能随仓库分发，所以 GitHub 托管 runner 上通常找不到 ——
          # 找不到就自动跳过编译，直接用仓库里 bundle\Contents\Windows 下已有的 DLL 打包。
          # 想让 CI 真正编译：设环境变量 ACAD_DIR，或把 DLL 放到 refs\acad2024\，或用自建 runner。
          $acad = $null
          $cand = @()
          if ($env:ACAD_DIR) { $cand += $env:ACAD_DIR }
          $cand += (Join-Path $env:PROJECT_ROOT 'refs\acad2024')
          $cand += 'D:\Program Files\AutoCAD 2024'
          $cand += 'C:\Program Files\Autodesk\AutoCAD 2024'
          foreach ($p in $cand) { if ($p -and (Test-Path (Join-Path $p 'acdbmgd.dll'))) { $acad = $p; break } }

          $wantBuild = ('${{ github.event.inputs.skip_build }}' -ne 'true')
          $skip = '1'
          if ($wantBuild -and $acad) { $skip = '0' }
          if ($skip -eq '0') {
            Write-Host "找到 AutoCAD 程序集：$acad，将重新编译插件"
            [System.IO.File]::AppendAllText($env:GITHUB_ENV, "ACAD_DIR=$acad`n", (New-Object System.Text.UTF8Encoding($false)))
          } else {
            Write-Host '::notice::未找到 AutoCAD 2024 程序集，跳过编译，使用仓库中已有的 DLL 打包'
          }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "SKIP_BUILD=$skip`n", (New-Object System.Text.UTF8Encoding($false)))

      - name: 打包（Setup.exe + zip + SHA256）
        shell: powershell
        run: |
          $mpArgs = @('-Version', $env:PKG_VERSION, '-Refs', $env:CODEX_REFS, '-Csc', $env:CODEX_CSC)
          if ($env:ACAD_DIR) { $mpArgs += @('-AcadDir', $env:ACAD_DIR) }
          if ($env:SKIP_BUILD -eq '1') { $mpArgs += '-SkipBuild' }
          & "$env:PROJECT_ROOT\package\make-package.ps1" @mpArgs
          if (-not $?) { throw '打包脚本执行失败' }
          $rel = Join-Path $env:PROJECT_ROOT 'release'
          Get-ChildItem $rel -File | ForEach-Object { Write-Host ($_.Name + '  ' + $_.Length + ' 字节') }
          if (-not (Test-Path (Join-Path $rel "CodexBlockLibrary-$env:PKG_VERSION-Setup.exe"))) { throw 'Setup.exe 未生成' }
          if (-not (Test-Path (Join-Path $rel "CodexBlockLibrary-$env:PKG_VERSION.zip"))) { throw 'zip 未生成' }

      - name: 代码签名（可选）
        # 在仓库 Settings → Variables 里加 SIGN_ENABLED=true 才会执行；
        # 再在 Secrets 里加 SIGN_PFX_BASE64（.pfx 的 base64）与 SIGN_PFX_PASSWORD。
        if: vars.SIGN_ENABLED == 'true'
        shell: powershell
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter 'signtool.exe' -ErrorAction SilentlyContinue |
                      Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw '未找到 signtool.exe' }
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [System.IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $rel = Join-Path $env:PROJECT_ROOT 'release'
          $exe = Join-Path $rel "CodexBlockLibrary-$env:PKG_VERSION-Setup.exe"
          & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p $env:SIGN_PFX_PASSWORD $exe
          if ($LASTEXITCODE -ne 0) { throw "签名失败 (exit $LASTEXITCODE)" }
          # 签名改变了文件内容，必须重算校验值
          $lines = New-Object System.Collections.Generic.List[string]
          foreach ($f in @($exe, (Join-Path $rel "CodexBlockLibrary-$env:PKG_VERSION.zip"))) {
            $lines.Add((Get-FileHash -LiteralPath $f -Algorithm SHA256).Hash + '  ' + (Split-Path -Leaf $f))
          }
          [System.IO.File]::WriteAllLines((Join-Path $rel 'SHA256SUMS.txt'), $lines)
          Get-AuthenticodeSignature $exe | Format-List Status, SignerCertificate

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: CodexBlockLibrary-${{ steps.ver.outputs.version }}
          path: |
            ${{ steps.locate.outputs.root }}/release/CodexBlockLibrary-*.exe
            ${{ steps.locate.outputs.root }}/release/CodexBlockLibrary-*.zip
            ${{ steps.locate.outputs.root }}/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $rel = Join-Path $env:PROJECT_ROOT 'release'
          $files = @(
            (Join-Path $rel "CodexBlockLibrary-$env:PKG_VERSION-Setup.exe"),
            (Join-Path $rel "CodexBlockLibrary-$env:PKG_VERSION.zip"),
            (Join-Path $rel 'SHA256SUMS.txt')
          )
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag 已存在，覆盖上传"
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "Codex 图块库 $tag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "创建 Release 失败 (exit $LASTEXITCODE)" }
